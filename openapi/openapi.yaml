openapi: 3.1.0
info:
  title: Lleno API
  version: 0.2.1
  summary: Product API for Lleno One
  description: |
    Canonical HTTP contract for `api.lleno.io`.

    Market: Mexico. Language: Spanish. Currency: MXN.

    Both `lleno-app` and `lleno-api` MUST implement against this document.
    Do not invent incompatible endpoints, fields, states, business rules,
    limits, or workflows.

    Authentication: the app establishes anonymous Supabase Auth. Every
    authenticated request sends `Authorization: Bearer <supabase-jwt>`.
    The API derives identity from the token. Clients MUST NOT submit
    arbitrary `user_id` ownership fields.

    Errors always use the `Error` envelope. Do not expose stack traces.

    Conventional HTTP status mapping for `error.code` (the frozen narrative
    contract specifies the envelope and codes, not numeric statuses):

    | code | status |
    | --- | --- |
    | UNAUTHORIZED | 401 |
    | FORBIDDEN | 403 |
    | ANALYSIS_NOT_FOUND | 404 |
    | UPLOAD_NOT_FOUND | 404 |
    | INVALID_FILE_TYPE | 400 |
    | FILE_TOO_LARGE | 400 |
    | VALIDATION_ERROR | 400 |
    | PAYMENT_REQUIRED | 402 |
    | PAYMENT_FAILED | 402 |
    | RECEIPT_LIMIT_REACHED | 409 |
    | PROCESSING_ALREADY_STARTED | 409 |
    | REVIEW_REQUIRED | 409 |
    | REVIEW_INCOMPLETE | 409 |
    | REPORT_NOT_READY | 409 |
    | PROCESSING_FAILED | 409 |
    | USAGE_LIMIT_REACHED | 409 |
    | ACCOUNT_VERIFICATION_REQUIRED | 403 |
    | SUBSCRIPTION_CONFLICT | 409 |
    | SUBSCRIPTION_NOT_FOUND | 404 |
    | PURCHASE_NOT_FOUND | 404 |
    | PURCHASE_CONFLICT | 409 |
    | PRODUCT_NOT_FOUND | 404 |
    | DELETION_PENDING | 409 |
    | DELETION_NOT_FOUND | 404 |
    | RATE_LIMITED | 429 |
    | INTERNAL_ERROR | 500 |

    Contract version: pin `LLENO_CONTRACT_VERSION=0.2.1`.
  license:
    name: Proprietary
servers:
  - url: https://api.lleno.io/v1
    description: Production
tags:
  - name: Health
  - name: Me
  - name: Analyses
  - name: Uploads
  - name: Processing
  - name: Review
  - name: Reports
  - name: Payments
  - name: Subscriptions
  - name: History
  - name: Monthly reports
  - name: Preferences
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.2.1
  /me:
    get:
      tags:
        - Me
      operationId: getMe
      summary: Current user
      description: Identity, One eligibility and atomic monthly receipt usage for the
        caller derived from the bearer JWT. Anonymous identities receive Free
        access. Verified status contains no email or other account PII.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                me-free:
                  $ref: "#/components/examples/me-free"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses:
    get:
      tags:
        - Analyses
      operationId: listAnalyses
      summary: List analysis history
      description: Caller-owned analyses, newest first. No pagination in MVP. Monthly
        receipt usage is returned by GET /me.
      responses:
        "200":
          description: Analyses newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/analysis.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Analyses
      operationId: createAnalysis
      summary: Create a free analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisRequest"
            example:
              mode: free
      responses:
        "201":
          description: Analysis created.
          content:
            application/json:
              schema:
                $ref: ../schemas/analysis.schema.json
              example:
                id: ana_xxx
                mode: free
                status: created
                max_receipts: 15
                receipt_count: 0
                created_at: 2026-09-07T15:41:08Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      tags:
        - Analyses
      operationId: getAnalysis
      summary: Get analysis
      responses:
        "200":
          description: Analysis, including progress when in flight.
          content:
            application/json:
              schema:
                $ref: ../schemas/analysis.schema.json
              examples:
                processing:
                  $ref: "#/components/examples/ProcessingAnalysis"
                needsReview:
                  $ref: "#/components/examples/NeedsReviewAnalysis"
                failed:
                  $ref: "#/components/examples/FailedAnalysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/uploads:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      tags:
        - Uploads
      operationId: createUploads
      summary: Request signed upload slots
      description: Requests signed upload slots. Maximum 15 receipt documents per
        analysis; atomic monthly allowance is separate. Each document contains
        one receipt. JPEG, PNG and PDF files are at most 10 MiB; PDF is at most
        five pages and images are at most 20 million decoded pixels per page and
        12,000 pixels per side. Upload URLs expire after exactly 600 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadsRequest"
            example:
              files:
                - filename: ticket.jpg
                  content_type: image/jpeg
                  size_bytes: 2849442
      responses:
        "200":
          description: Signed upload slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          description: Límite mensual alcanzado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: USAGE_LIMIT_REACHED
                  message: Límite mensual alcanzado.
                  details: {}
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/uploads/complete:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      tags:
        - Uploads
      operationId: completeUploads
      summary: Confirm uploads
      description: |
        Validates that each object exists in private storage. Any non-empty
        subset of issued receipt IDs may be confirmed, and repeated
        confirmation is idempotent. Receipts move from `pending_upload` to
        `uploaded`. The analysis moves to `ready_to_process` only when at
        least one receipt is uploaded and no active pending slot remains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadsRequest"
            example:
              receipt_ids:
                - rec_xxx
      responses:
        "200":
          description: Uploads confirmed.
          content:
            application/json:
              schema:
                $ref: ../schemas/analysis.schema.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Analysis or upload not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/process:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      tags:
        - Processing
      operationId: startProcessing
      summary: Start processing
      description: |
        The first valid call from ready_to_process creates one processing run
        and returns queued. Repeating the call while the analysis is queued
        returns the same 200 response and MUST NOT create a second run. Once a
        processor has advanced the analysis to processing, or a later
        processing/report state, the call returns 409
        PROCESSING_ALREADY_STARTED and MUST NOT restart the run.
      responses:
        "200":
          description: Processing accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResponse"
              example:
                analysis_id: ana_xxx
                status: queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/review:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      tags:
        - Review
      operationId: getReview
      summary: Get review issues
      description: |
        Lightweight review of ambiguous items only. Valid while analysis
        `status` is `needs_review`.

        Returns every ambiguous issue while review is open, including issues
        that already have a persisted `resolution`. Unresolved issues have
        `resolution: null`. Refresh and reopen restore successful prior
        actions from this resource. Unsaved form drafts are not part of this
        resource.

        Frontend copy example: "Encontramos 63 productos. 3 necesitan tu ayuda."
        Count unresolved issues (`resolution` is null) as needing help; do not
        treat `issues.length` as the unresolved count.
      responses:
        "200":
          description: Review issues, including already-resolved ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
              examples:
                unresolved:
                  summary: Open review with an unresolved issue
                  value:
                    analysis_id: ana_xxx
                    total_items: 63
                    issues:
                      - id: review_xxx
                        receipt_id: rec_xxx
                        item_id: item_xxx
                        raw_label: CC PET 2.5
                        suggested_name: Coca-Cola Original 2.5 L
                        quantity: 1
                        line_total: 44
                        confidence: 0.67
                        resolution: null
                mixed:
                  summary: Open review with one persisted action and one unresolved issue
                  value:
                    analysis_id: ana_xxx
                    total_items: 63
                    issues:
                      - id: review_xxx
                        receipt_id: rec_xxx
                        item_id: item_xxx
                        raw_label: CC PET 2.5
                        suggested_name: Coca-Cola Original 2.5 L
                        quantity: 1
                        line_total: 44
                        confidence: 0.67
                        resolution:
                          action: edit
                          product_name: Coca-Cola Original
                          quantity: 1
                          size_value: 2.5
                          size_unit: L
                          line_total: 44
                      - id: review_yyy
                        receipt_id: rec_xxx
                        item_id: item_yyy
                        raw_label: LCH DESL 1L
                        suggested_name: Leche descremada 1 L
                        quantity: 2
                        line_total: 36
                        confidence: 0.54
                        resolution: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/review/{issue_id}:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
      - $ref: "#/components/parameters/IssueId"
    patch:
      tags:
        - Review
      operationId: updateReviewIssue
      summary: Update a review item
      description: |
        Persists the issue resolution and returns the full updated canonical
        issue. Valid while analysis `status` is `needs_review`.

        Resource-update semantics: repeating the same valid PATCH MUST NOT
        duplicate side effects. The latest valid persisted resolution is
        authoritative. Until review confirmation, the user MAY change the
        action or correction with another valid PATCH.

        `accept`, `remove`, and `unrecognized` require only `action`.
        `edit` may contain only `product_name`, `quantity`, `size_value`,
        `size_unit`, and `line_total`, and MUST include at least one actual
        correction. `size_value` and `size_unit` are valid only as a pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewIssueRequest"
            examples:
              accept:
                value:
                  action: accept
              edit:
                value:
                  action: edit
                  product_name: Coca-Cola Original
                  quantity: 1
                  size_value: 2.5
                  size_unit: L
                  line_total: 44
              remove:
                value:
                  action: remove
              unrecognized:
                value:
                  action: unrecognized
      responses:
        "200":
          description: Full updated canonical issue, including persisted resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewIssue"
              examples:
                accept:
                  value:
                    id: review_xxx
                    receipt_id: rec_xxx
                    item_id: item_xxx
                    raw_label: CC PET 2.5
                    suggested_name: Coca-Cola Original 2.5 L
                    quantity: 1
                    line_total: 44
                    confidence: 0.67
                    resolution:
                      action: accept
                edit:
                  value:
                    id: review_xxx
                    receipt_id: rec_xxx
                    item_id: item_xxx
                    raw_label: CC PET 2.5
                    suggested_name: Coca-Cola Original 2.5 L
                    quantity: 1
                    line_total: 44
                    confidence: 0.67
                    resolution:
                      action: edit
                      product_name: Coca-Cola Original
                      quantity: 1
                      size_value: 2.5
                      size_unit: L
                      line_total: 44
                remove:
                  value:
                    id: review_xxx
                    receipt_id: rec_xxx
                    item_id: item_xxx
                    raw_label: CC PET 2.5
                    suggested_name: Coca-Cola Original 2.5 L
                    quantity: 1
                    line_total: 44
                    confidence: 0.67
                    resolution:
                      action: remove
                unrecognized:
                  value:
                    id: review_xxx
                    receipt_id: rec_xxx
                    item_id: item_xxx
                    raw_label: CC PET 2.5
                    suggested_name: Coca-Cola Original 2.5 L
                    quantity: 1
                    line_total: 44
                    confidence: 0.67
                    resolution:
                      action: unrecognized
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/review/confirm:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      tags:
        - Review
      operationId: confirmReview
      summary: Confirm review and continue generation
      description: |
        Permitted only while analysis `status` is `needs_review` and every
        review issue has a persisted resolution.

        If any issue is unresolved, return 409 `REVIEW_INCOMPLETE` with
        `details.unresolved_count` and `details.unresolved_issue_ids`
        (`review_…` IDs only; no OCR, filenames, or purchase payloads).

        On success the backend resumes the canonical analysis lifecycle and
        returns the updated Analysis. Typical next status is
        `generating_report`. Clients MUST use that resource and MUST NOT
        invent `generating_report` locally.

        After the analysis leaves `needs_review`, further review PATCH or
        confirm requests are invalid. Unknown confirmation outcomes MUST be
        recovered by GET Analysis (and GET review only if status is still
        `needs_review`), not by blindly retrying the mutation.
      responses:
        "200":
          description: Canonical Analysis after review confirmation.
          content:
            application/json:
              schema:
                $ref: ../schemas/analysis.schema.json
              example:
                id: ana_xxx
                mode: free
                status: generating_report
                max_receipts: 15
                receipt_count: 15
                created_at: 2026-09-07T14:12:44Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          description: |
            Incomplete review (`REVIEW_INCOMPLETE`) or the analysis is no
            longer in `needs_review`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                incomplete:
                  value:
                    error:
                      code: REVIEW_INCOMPLETE
                      message: Aún faltan productos por revisar.
                      details:
                        unresolved_count: 2
                        unresolved_issue_ids:
                          - review_xxx
                          - review_yyy
        "429":
          $ref: "#/components/responses/RateLimited"
  /analyses/{analysis_id}/report:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      tags:
        - Reports
      operationId: getReport
      summary: Get Wrapped report
      description: |
        Available only when analysis `status` is `completed`.

        Free: `access=free`, `full=null`, `upgrade.available=true`.
        Full: `access=full`, `full` populated.

        Arithmetic is deterministic. Personality and insight wording may
        come from AI but must be schema-validated and evidence-grounded.
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema:
                $ref: ../schemas/report.schema.json
              examples:
                free:
                  $ref: "#/components/examples/FreeReport"
                full:
                  $ref: "#/components/examples/FullReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /subscriptions:
    get:
      tags:
        - Subscriptions
      operationId: getSubscription
      summary: Current One subscription
      description: Returns current provider-independent access state. Paid access
        requires verified provider evidence; a checkout redirect never grants
        access.
      responses:
        "200":
          description: Current account plan and subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
              examples:
                subscription-active:
                  $ref: "#/components/examples/subscription-active"
        "401": &a1
          $ref: "#/components/responses/Unauthorized"
        "429": &a2
          $ref: "#/components/responses/RateLimited"
  /subscriptions/checkout:
    post:
      tags:
        - Subscriptions
      operationId: createSubscriptionCheckout
      summary: Start One subscription checkout
      description: Requires a verified permanent account. Server selects One at
        exactly MXN 49.00 per provider monthly cycle. Idempotency-Key is
        required. Checkout creation and authorization do not grant access; only
        verified payment does. No payment card or provider identifiers are
        accepted from or returned to the client.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      responses:
        "200":
          description: Hosted checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckout"
              example:
                checkout_url: https://pay.example/checkout/session
                price_mxn: "49.00"
                currency: MXN
                interval: month
        "401": *a1
        "403":
          description: Account is not verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ACCOUNT_VERIFICATION_REQUIRED
                  message: Verifica tu cuenta para continuar.
                  details: {}
        "409":
          description: Ya existe una suscripción vigente o pendiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SUBSCRIPTION_CONFLICT
                  message: Ya existe una suscripción vigente o pendiente.
                  details: {}
        "429": *a2
  /subscriptions/cancel:
    post:
      tags:
        - Subscriptions
      operationId: cancelSubscription
      summary: Cancel One renewal
      description: Idempotently requests cancellation at the end of the already
        verified paid period. It does not erase data or shorten that paid
        period. Provider failure is reported and is not represented as a
        completed cancellation.
      responses:
        "200":
          description: Cancellation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
              example:
                plan: one
                subscription:
                  status: active
                  price_mxn: "49.00"
                  interval: month
                  current_period_end: 2026-11-01T05:00:00Z
                  paid_through: 2026-11-01T05:00:00Z
                  cancel_at_period_end: true
                  access: one
        "401": *a1
        "404":
          description: No se encontró una suscripción vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SUBSCRIPTION_NOT_FOUND
                  message: No se encontró una suscripción vigente.
                  details: {}
        "409":
          description: No se pudo actualizar la suscripción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SUBSCRIPTION_CONFLICT
                  message: No se pudo actualizar la suscripción.
                  details: {}
        "429": *a2
  /history:
    get:
      tags:
        - History
      operationId: searchPurchases
      summary: Search owned purchases
      description: Returns only the caller household’s sanitized, accepted purchases.
        Stable owner-bound opaque cursor pagination, bounded page size,
        inclusive owner-local purchase-date filters, and case/accent-insensitive
        matching. Unknown dates are excluded from date filters and month
        buckets. No cross-account or externally sourced prices.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: store_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: product_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Page of caller-owned purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePage"
              examples:
                purchase-history:
                  $ref: "#/components/examples/purchase-history"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": *a1
        "429": *a2
  /reports/monthly:
    get:
      tags:
        - Monthly reports
      operationId: getMonthlyReport
      summary: Get personal monthly report
      description: month is YYYY-MM in the owner timezone. New One monthly reports are
        generated only with active paid access; previously generated reports
        remain readable after cancellation and are not recomputed without
        access. Reports describe only observed receipts and expose dated/undated
        count, category coverage and receipt-total reconciliation. Unknown dates
        never become a fabricated date. Comparisons use the preceding calendar
        month and comparable product/variant units only. Cached results are
        invalidated by corrections, late purchases or deletion.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
      responses:
        "200":
          description: Observed monthly report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
              examples:
                monthly-report:
                  $ref: "#/components/examples/monthly-report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": *a1
        "403": &a3
          $ref: "#/components/responses/Forbidden"
        "429": *a2
  /products/{product_id}/prices:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - History
      operationId: getPersonalProductPrices
      summary: Get personal observed prices
      description: Returns only observations from the caller’s accepted receipts,
        ordered by purchase date. Price series group by confirmed variant and
        comparable normalized unit. Prices are historical receipt evidence, not
        live offers. Ambiguous variants stay separate; insufficient observations
        do not produce savings claims.
      responses:
        "200":
          description: Personal price observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPriceHistory"
              examples:
                personal-price-history:
                  $ref: "#/components/examples/personal-price-history"
        "401": *a1
        "404":
          description: No se encontró el producto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PRODUCT_NOT_FOUND
                  message: No se encontró el producto.
                  details: {}
        "429": *a2
  /purchases/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    patch:
      tags:
        - History
      operationId: correctPurchase
      summary: Correct an accepted purchase
      description: Corrects only a caller-owned sanitized accepted item. Exact decimal
        money and quantity strings are used for the ledger. A correction updates
        source-backed history and invalidates the purchase month and following
        month report. It never changes another owner’s catalog aliases. If
        corrected into a duplicate, the client must confirm the merge through
        the documented duplicate action before one allowance slot is released.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCorrection"
      responses:
        "200":
          description: Updated purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
              example:
                id: item_xxx
                receipt_id: rec_xxx
                purchase_date: 2026-09-04
                merchant: Tienda
                product: Leche
                quantity: "2"
                line_total_mxn: "64.00"
                category_id: lacteos
                variant_id: null
                normalized_unit: null
                updated_at: 2026-10-11T00:00:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": *a1
        "403": *a3
        "404":
          description: No se encontró la compra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PURCHASE_NOT_FOUND
                  message: No se encontró la compra.
                  details: {}
        "409":
          description: La compra cambió; vuelve a cargar el historial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PURCHASE_CONFLICT
                  message: La compra cambió; vuelve a cargar el historial.
                  details: {}
        "429": *a2
  /me/preferences:
    patch:
      tags:
        - Preferences
      operationId: updatePreferences
      summary: Update report timezone
      description: Stores the caller’s IANA timezone for calendar-month reporting and
        usage. UTC remains the storage format for timestamps. Existing
        subscription billing periods are not changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - timezone
              properties:
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Valid IANA timezone.
      responses:
        "200":
          description: Updated caller summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                profile_id: prf_xxx
                anonymous: false
                verified: true
                household_id: hh_xxx
                plan: free
                subscription: null
                timezone: America/Matamoros
                usage:
                  month: 2026-10
                  allowance: 5
                  used: 2
                  reserved: 0
                  remaining: 3
                  resets_at: 2026-11-01T06:00:00Z
                  timezone: America/Matamoros
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": *a1
        "429": *a2
  /me/deletion:
    post:
      tags:
        - Me
      operationId: requestAccountDeletion
      summary: Request account deletion
      description: Idempotently requests deletion of the authenticated owner’s account
        and owned purchase history. The response is an asynchronous request
        status, not proof that physical data is already deleted. In-flight raw
        objects are deleted under the raw-file deadline. Only minimum legally
        required payment/audit records may remain, pseudonymized and
        inaccessible to product features.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirm
              properties:
                confirm:
                  type: boolean
                  const: true
      responses:
        "202":
          description: Deletion request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStatus"
              example:
                status: requested
                requested_at: 2026-10-11T12:00:00Z
                completed_at: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags:
        - Me
      operationId: getAccountDeletion
      summary: Get account deletion status
      description: Returns only the authenticated owner’s asynchronous deletion
        status. A completed response means owned product data was purged; it
        does not claim deletion of minimum legally retained, pseudonymized
        financial records.
      responses:
        "200":
          description: Deletion request status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStatus"
              example:
                status: requested
                requested_at: 2026-10-11T12:00:00Z
                completed_at: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified Supabase JWT, anonymous or permanent. Subscription
        checkout requires verified permanent identity.
  parameters:
    AnalysisId:
      name: analysis_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^ana_
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^review_
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Inicia sesión para continuar.
              details: {}
    Forbidden:
      description: Authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: No tienes acceso a este análisis.
              details: {}
    AnalysisNotFound:
      description: Analysis does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: ANALYSIS_NOT_FOUND
              message: No encontramos este análisis.
              details: {}
    BadRequest:
      description: Validation, file type, or file size error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        State conflict. Codes include RECEIPT_LIMIT_REACHED,
        PROCESSING_ALREADY_STARTED, REVIEW_REQUIRED, REVIEW_INCOMPLETE,
        REPORT_NOT_READY, PROCESSING_FAILED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RECEIPT_LIMIT_REACHED
              message: Este análisis ya alcanzó el máximo de tickets.
              details: {}
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Demasiadas solicitudes. Intenta de nuevo en un momento.
              details: {}
    NotFound:
      description: Deletion request was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DELETION_NOT_FOUND
              message: No se encontró la solicitud.
              details: {}
  examples:
    ProcessingAnalysis:
      summary: Analysis while processing
      externalValue: ../fixtures/processing-analysis.json
    NeedsReviewAnalysis:
      summary: Analysis waiting on lightweight review
      externalValue: ../fixtures/needs-review.json
    FailedAnalysis:
      summary: Failed analysis
      externalValue: ../fixtures/failed-analysis.json
    FreeReport:
      summary: Free Wrapped
      externalValue: ../fixtures/free-report.json
    FullReport:
      summary: Full Wrapped
      externalValue: ../fixtures/full-report.json
    me-free:
      summary: me free
      externalValue: ../fixtures/me-free.json
    subscription-active:
      summary: subscription active
      externalValue: ../fixtures/subscription-active.json
    purchase-history:
      summary: purchase history
      externalValue: ../fixtures/purchase-history.json
    monthly-report:
      summary: monthly report
      externalValue: ../fixtures/monthly-report.json
    personal-price-history:
      summary: personal price history
      externalValue: ../fixtures/personal-price-history.json
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          minLength: 1
    Me:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - anonymous
        - verified
        - household_id
        - plan
        - subscription
        - timezone
        - usage
      properties:
        profile_id:
          type: string
          minLength: 1
        anonymous:
          type: boolean
        household_id:
          type: string
          minLength: 1
        verified:
          type: boolean
          description: True only when the validated Supabase JWT represents a verified
            permanent identity.
        plan:
          type: string
          enum:
            - free
            - one
        subscription:
          anyOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        timezone:
          type: string
          minLength: 1
          description: IANA timezone stored for this owner; initial default is
            America/Matamoros.
        usage:
          $ref: "#/components/schemas/MonthlyUsage"
    CreateAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          const: free
    CreateUploadsRequest:
      type: object
      additionalProperties: false
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - filename
              - content_type
              - size_bytes
            properties:
              filename:
                type: string
                minLength: 1
              content_type:
                type: string
                enum:
                  - image/jpeg
                  - image/png
                  - application/pdf
              size_bytes:
                type: integer
                exclusiveMinimum: 0
                maximum: 10485760
                description: Maximum 10 MiB per receipt file.
    CreateUploadsResponse:
      type: object
      additionalProperties: false
      required:
        - uploads
      properties:
        uploads:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - receipt_id
              - upload_url
              - expires_at
              - required_headers
            properties:
              receipt_id:
                type: string
                pattern: ^rec_
              upload_url:
                type: string
                format: uri
                description: Short-lived signed URL. Never log it.
              expires_at:
                type: string
                format: date-time
                description: Signed PUT URL expiration, 600 seconds after issuance.
              required_headers:
                type: object
                additionalProperties:
                  type: string
    CompleteUploadsRequest:
      type: object
      additionalProperties: false
      required:
        - receipt_ids
      properties:
        receipt_ids:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^rec_
    ProcessResponse:
      type: object
      additionalProperties: false
      required:
        - analysis_id
        - status
      properties:
        analysis_id:
          type: string
          pattern: ^ana_
        status:
          type: string
          enum:
            - queued
            - processing
            - needs_review
            - generating_report
            - completed
            - failed
    Review:
      type: object
      additionalProperties: false
      required:
        - analysis_id
        - total_items
        - issues
      properties:
        analysis_id:
          type: string
          pattern: ^ana_
        total_items:
          type: integer
          minimum: 0
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ReviewIssue"
    ReviewIssue:
      type: object
      additionalProperties: false
      required:
        - id
        - receipt_id
        - item_id
        - raw_label
        - suggested_name
        - quantity
        - line_total
        - confidence
        - resolution
      properties:
        id:
          type: string
          pattern: ^review_
        receipt_id:
          type: string
          pattern: ^rec_
        item_id:
          type: string
          pattern: ^item_
        raw_label:
          type: string
          description: Original sanitized line. No PII.
        suggested_name:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
        line_total:
          type: number
          description: MXN. JSON number with two decimal places.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        resolution:
          description: |
            Persisted user resolution. Null while unresolved. Refresh and
            reopen restore this server value. Unsaved form drafts are not
            part of this resource.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UpdateReviewIssueRequest"
    ReviewIssueSimpleActionRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - accept
            - remove
            - unrecognized
          description: These actions MUST NOT include edit fields.
    ReviewIssueEditRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          const: edit
        product_name:
          type: string
          minLength: 1
        quantity:
          type: number
          exclusiveMinimum: 0
        size_value:
          type: number
          exclusiveMinimum: 0
        size_unit:
          type: string
          minLength: 1
          examples:
            - L
            - ml
            - kg
            - g
            - piece
            - pack
        line_total:
          type: number
          description: MXN. JSON number with two decimal places.
      dependentRequired:
        size_value:
          - size_unit
        size_unit:
          - size_value
      anyOf:
        - required:
            - product_name
          properties:
            product_name:
              type: string
        - required:
            - quantity
          properties:
            quantity:
              type: number
        - required:
            - line_total
          properties:
            line_total:
              type: number
        - required:
            - size_value
            - size_unit
          properties:
            size_value:
              type: number
            size_unit:
              type: string
      description: |
        `edit` MUST contain at least one actual correction. `size_value` and
        `size_unit` are valid only as a pair. No additional editable fields.
    UpdateReviewIssueRequest:
      oneOf:
        - $ref: "#/components/schemas/ReviewIssueSimpleActionRequest"
        - $ref: "#/components/schemas/ReviewIssueEditRequest"
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - ANALYSIS_NOT_FOUND
                - INVALID_FILE_TYPE
                - FILE_TOO_LARGE
                - RECEIPT_LIMIT_REACHED
                - UPLOAD_NOT_FOUND
                - PROCESSING_ALREADY_STARTED
                - PROCESSING_FAILED
                - REVIEW_REQUIRED
                - REVIEW_INCOMPLETE
                - REPORT_NOT_READY
                - PAYMENT_REQUIRED
                - PAYMENT_FAILED
                - RATE_LIMITED
                - VALIDATION_ERROR
                - INTERNAL_ERROR
                - USAGE_LIMIT_REACHED
                - SUBSCRIPTION_CONFLICT
                - SUBSCRIPTION_NOT_FOUND
                - PURCHASE_NOT_FOUND
                - PURCHASE_CONFLICT
                - PRODUCT_NOT_FOUND
                - ACCOUNT_VERIFICATION_REQUIRED
                - DELETION_PENDING
                - DELETION_NOT_FOUND
            message:
              type: string
              description: Mexican Spanish user-facing message. No stack traces.
            details:
              type: object
              additionalProperties: true
    MonthlyUsage:
      type: object
      additionalProperties: false
      required:
        - month
        - allowance
        - used
        - reserved
        - remaining
        - resets_at
        - timezone
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        allowance:
          type: integer
          enum:
            - 5
            - 100
        used:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        resets_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
    Subscription:
      type: object
      additionalProperties: false
      required:
        - status
        - price_mxn
        - interval
        - current_period_end
        - paid_through
        - cancel_at_period_end
        - access
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - past_due
            - canceled
            - ended
        price_mxn:
          type: string
          const: "49.00"
        interval:
          type: string
          const: month
        current_period_end:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        paid_through:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        cancel_at_period_end:
          type: boolean
        access:
          type: string
          enum:
            - free
            - one
    SubscriptionStatus:
      type: object
      additionalProperties: false
      required:
        - plan
        - subscription
      properties:
        plan:
          type: string
          enum:
            - free
            - one
        subscription:
          anyOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
    SubscriptionCheckout:
      type: object
      additionalProperties: false
      required:
        - checkout_url
        - price_mxn
        - currency
        - interval
      properties:
        checkout_url:
          type: string
          format: uri
          pattern: ^https://
        price_mxn:
          type: string
          const: "49.00"
        currency:
          type: string
          const: MXN
        interval:
          type: string
          const: month
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - receipt_id
        - purchase_date
        - merchant
        - product
        - quantity
        - line_total_mxn
        - category_id
        - variant_id
        - normalized_unit
        - updated_at
      properties:
        id:
          type: string
        receipt_id:
          type: string
        purchase_date:
          anyOf:
            - type: string
              format: date
            - type: "null"
        merchant:
          type: string
        product:
          type: string
        quantity:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        line_total_mxn:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
        category_id:
          type: string
        variant_id:
          anyOf:
            - type: string
            - type: "null"
        normalized_unit:
          anyOf:
            - type: string
            - type: "null"
        updated_at:
          type: string
          format: date-time
    PurchaseCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        purchase_date:
          anyOf:
            - type: string
              format: date
            - type: "null"
        merchant:
          type: string
          minLength: 1
          maxLength: 160
        product:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        line_total_mxn:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
        category_id:
          type: string
          maxLength: 100
        variant_id:
          anyOf:
            - type: string
            - type: "null"
        normalized_unit:
          anyOf:
            - type: string
            - type: "null"
        expected_updated_at:
          type: string
          format: date-time
      required:
        - expected_updated_at
    PurchasePage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - timezone
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Purchase"
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
        timezone:
          type: string
    ProductPriceHistory:
      type: object
      additionalProperties: false
      required:
        - product_id
        - observations
        - comparison
      properties:
        product_id:
          type: string
        observations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - purchase_id
              - purchase_date
              - merchant
              - line_total_mxn
              - quantity
              - normalized_unit_price_mxn
              - normalized_unit
            properties:
              purchase_id:
                type: string
              purchase_date:
                anyOf:
                  - type: string
                    format: date
                  - type: "null"
              merchant:
                type: string
              line_total_mxn:
                type: string
                pattern: ^[0-9]+\.[0-9]{2}$
              quantity:
                type: string
              normalized_unit_price_mxn:
                anyOf:
                  - type: string
                    pattern: ^[0-9]+\.[0-9]{2}$
                  - type: "null"
              normalized_unit:
                anyOf:
                  - type: string
                  - type: "null"
        comparison:
          type: string
          enum:
            - comparable
            - insufficient_data
            - incomparable
    MonthlyReport:
      type: object
      additionalProperties: false
      required:
        - month
        - timezone
        - receipt_count
        - dated_receipt_count
        - undated_receipt_count
        - total_spent_mxn
        - category_coverage
        - unclassified_spending_mxn
        - reconciliation
        - categories
        - merchants
        - recurring_products
        - changes
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        timezone:
          type: string
        receipt_count:
          type: integer
          minimum: 0
        dated_receipt_count:
          type: integer
          minimum: 0
        undated_receipt_count:
          type: integer
          minimum: 0
        total_spent_mxn:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
        category_coverage:
          type: number
          minimum: 0
          maximum: 1
        unclassified_spending_mxn:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
        reconciliation:
          type: string
          enum:
            - complete
            - incomplete
            - discrepant
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - category_id
              - amount_mxn
              - share
            properties:
              category_id:
                type: string
              amount_mxn:
                type: string
                pattern: ^[0-9]+\.[0-9]{2}$
              share:
                type: number
                minimum: 0
                maximum: 1
        merchants:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - merchant
              - amount_mxn
              - receipt_count
            properties:
              merchant:
                type: string
              amount_mxn:
                type: string
                pattern: ^[0-9]+\.[0-9]{2}$
              receipt_count:
                type: integer
                minimum: 0
        recurring_products:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - product
              - variant_id
              - normalized_unit
              - receipt_count
              - amount_mxn
            properties:
              product:
                type: string
              variant_id:
                anyOf:
                  - type: string
                  - type: "null"
              normalized_unit:
                anyOf:
                  - type: string
                  - type: "null"
              receipt_count:
                type: integer
                minimum: 0
                description: Distinct receipts, not line rows.
              amount_mxn:
                type: string
                pattern: ^[0-9]+\.[0-9]{2}$
        changes:
          type: object
          additionalProperties: false
          required:
            - available
            - reason
          properties:
            available:
              type: boolean
            reason:
              anyOf:
                - type: string
                  enum:
                    - insufficient_prior_month_data
                    - coverage_changed
                    - no_change
                - type: "null"
    DeletionStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - requested_at
        - completed_at
      properties:
        status:
          type: string
          enum:
            - requested
            - processing
            - completed
            - failed
        requested_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
